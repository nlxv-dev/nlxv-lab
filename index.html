<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLXV — Independent Digital Laboratory</title>
    <meta name="description" content="NLXV — independent digital laboratory: digital products, web systems, AI research and media art.">
    <meta name="theme-color" content="#fcfbfa" id="metaThemeColor">
    <meta property="og:title" content="NLXV — Independent Digital Laboratory">
    <meta property="og:description" content="Digital products, web systems, AI research and media art.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c1e'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-style='italic' font-size='18' text-anchor='middle' fill='%23fcfbfa'%3EN%3C/text%3E%3C/svg%3E">

    <!-- Тема применяется ДО первой отрисовки, чтобы не было вспышки.
         По умолчанию — светлая; выбор пользователя запоминается. -->
    <script>
        (function () {
            var theme = 'light';
            try {
                if (localStorage.getItem('nlxv-theme') === 'dark') theme = 'dark';
            } catch (e) { /* storage недоступен — остаёмся на светлой */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ===================== ШАПКА ===================== -->
    <header class="header">
        <div class="container header-wrap">
            <a class="logo" href="#" aria-label="NLXV — home">NLXV</a>
            <div class="controls">
                <button id="langToggle" class="lang-btn js-roll" type="button" aria-label="Switch language">EN</button>
                <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle theme">
                    <!-- Луна: показывается в светлой теме (нажать → тёмная) -->
                    <svg class="theme-icon icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    <!-- Солнце: показывается в тёмной теме (нажать → светлая) -->
                    <svg class="theme-icon icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="5" stroke-width="1.5"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M19.78 4.22l-1.42 1.42"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ===================== ОСНОВНОЙ КОНТЕНТ ===================== -->
    <main class="main-content" id="main">
        <div class="container">

            <!-- Hero (заголовок всегда английский) -->
            <section class="hero-section">
                <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span><span id="eyebrowText">Index / 04</span></p>
                <h1 class="hero-title">
                    NLXV — <span class="font-serif-italic">Independent</span><br>
                    <span class="hero-muted">Digital Laboratory.</span>
                </h1>
            </section>

            <!-- Бегущая строка стека (заполняется из app.js) -->
            <div class="marquee" id="stackMarquee" aria-hidden="true"></div>

            <!-- SPA-контейнер: между видами переключаемся по #hash -->
            <section id="listSection" class="list-section">
                <div class="view list-wrap" data-view="main" id="labList"></div>
                <div class="view catalog-wrap" data-view="projects" id="projectsCatalog"></div>
            </section>
        </div>
    </main>

    <!-- ===================== ФУТЕР ===================== -->
    <footer class="footer">
        <div class="container stealth-wrap">
            <p id="stealthText" class="stealth-link">NLXV / Research — [Stealth Mode] / Internal ecosystem &amp; closed R&amp;D prototypes.</p>
        </div>
    </footer>

</body>
</html>
