<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLXV — Independent Digital Laboratory</title>

    <!-- Премиальные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Темизация на чистом CSS */
        .dark {
            --bg-main: #070708;
            --text-primary: #ffffff;
            --text-muted: #86868b;
            --border-color: rgba(255, 255, 255, 0.08);
            --stealth-color: #161617;
            --stealth-hover: rgba(255, 255, 255, 0.2);
            --hover-bg: rgba(255, 255, 255, 0.01);
        }
        .light {
            --bg-main: #fcfbfa;
            --text-primary: #1c1c1e;
            --text-muted: #68686e;
            --border-color: rgba(0, 0, 0, 0.08);
            --stealth-color: #e5e5ea;
            --stealth-hover: rgba(0, 0, 0, 0.4);
            --hover-bg: rgba(0, 0, 0, 0.015);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Полностью убирает сине-серую подсветку при тапе на смартфонах */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .font-serif-italic {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 max(2rem, 6vw);
        }

        /* Шапка сайта */
        .header {
            width: 100%;
            padding: 2.5rem 0;
        }

        .header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        .lang-btn {
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .lang-btn:hover {
            opacity: 1;
        }

        /* Кнопка темы */
        .theme-btn {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            padding: 0;
            margin: 0;
            outline: none;
            line-height: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .theme-btn:hover {
            opacity: 1;
        }

        .theme-icon {
            width: 1.25rem;
            height: 1.25rem;
            display: block;
            margin: 0 auto;
            flex-shrink: 0;
        }

        /* Главный экран */
        .main-content {
            width: 100%;
            flex-grow: 1;
            padding-top: max(3rem, 5vh);
            padding-bottom: max(3rem, 5vh);
        }

        .hero-section {
            margin-bottom: 5rem;
        }

        .hero-title {
            font-size: clamp(2.2rem, 5.5vw, 5rem);
            font-weight: 300;
            line-height: 1.12;
            letter-spacing: -0.03em;
            max-width: 90%;
        }

        /* ===== СЕКЦИЯ СПИСКА + КАТАЛОГ ===== */
        .list-section {
            position: relative;
            border-top: 1px solid var(--border-color);
        }

        .list-wrap,
        .catalog-wrap {
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Главный список направлений */
        .list-wrap {
            display: flex;
            flex-direction: column;
        }

        .list-wrap.is-hidden {
            opacity: 0;
            transform: translateY(-12px);
            pointer-events: none;
        }

        .list-item {
            display: flex;
            flex-direction: column;
            padding: 2.4rem 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            transition: padding-left 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @media (min-width: 768px) {
            .list-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .list-item:hover {
            padding-left: 1.5rem;
            background-color: var(--hover-bg);
        }

        .item-title {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .list-item:hover .item-title {
            transform: translateX(4px);
        }

        .item-desc {
            font-size: 0.98rem;
            color: var(--text-muted);
            max-width: 580px;
            line-height: 1.55;
            margin-top: 0.5rem;
            transition: color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 768px) {
            .item-desc {
                margin-top: 0;
                text-align: right;
            }
        }

        /* КАТАЛОГ ПРОЕКТОВ */
        .catalog-wrap {
            display: none;
            opacity: 0;
            transform: translateY(12px);
        }

        .catalog-wrap.is-shown {
            display: block;
        }

        .catalog-wrap.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.5;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0;
            transition: opacity 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .back-arrow {
            width: 1rem;
            height: 1rem;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-btn:hover .back-arrow {
            transform: translateX(-4px);
        }

        .catalog-counter {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .catalog-list {
            display: flex;
            flex-direction: column;
        }

        .project-card {
            display: grid;
            grid-template-columns: 3rem 1fr auto;
            gap: 2rem;
            align-items: center;
            padding: 2.4rem 0;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            transition: padding-left 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        a.project-card {
            cursor: pointer;
        }

        .project-card:hover {
            padding-left: 1.5rem;
            background-color: var(--hover-bg);
        }

        .project-num {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 0;
        }

        .project-name {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-card:hover .project-name {
            transform: translateX(4px);
        }

        .project-stack {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.55;
            max-width: 640px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .project-card:hover .project-link {
            color: var(--text-primary);
        }

        .project-link svg {
            width: 0.85rem;
            height: 0.85rem;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-card:hover .project-link svg {
            transform: translate(3px, -3px);
        }

        @media (max-width: 767px) {
            .project-card {
                grid-template-columns: 1fr;
                gap: 0.9rem;
                padding: 2rem 0;
            }

            .project-num {
                font-size: 0.85rem;
            }

            .project-link {
                justify-self: start;
            }
        }

        /* Футер */
        .footer {
            padding: 3rem 0;
        }

        .stealth-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stealth-link {
            font-size: 0.7rem;
            color: var(--stealth-color);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            text-decoration: none;
            text-align: center;
            transition: color 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .stealth-link:hover {
            color: var(--stealth-hover);
        }
    </style>
</head>
<body class="dark" id="bodyRoot">

    <!-- Шапка сайта -->
    <header class="header">
        <div class="container header-wrap">
            <div class="logo">NLXV</div>
            <div class="controls">
                <button id="langToggle" class="lang-btn">EN</button>
                <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
                    <svg id="themeIconMoon" class="theme-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    <svg id="themeIconSun" class="theme-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: block;">
                        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M19.78 4.22l-1.42 1.42"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="container">
            <section class="hero-section">
                <h1 id="heroTitle" class="hero-title">NLXV — <span class="font-serif-italic">Independent</span> Digital Laboratory.</h1>
            </section>

            <section id="listSection" class="list-section">
                <div id="labList" class="list-wrap"></div>
                <div id="projectsCatalog" class="catalog-wrap"></div>
            </section>
        </div>
    </div>

    <!-- Футер -->
    <footer class="footer">
        <div class="container stealth-wrap">
            <a href="#" id="stealthText" class="stealth-link">NLXV / Research — [Stealth Mode] / Internal ecosystem & closed R&D prototypes.</a>
        </div>
    </footer>

    <!-- Мультиязычный контент и логика переключения -->
    <script>
        // ============================================================
        //  БАЗА КОНТЕНТА (главный заголовок не переводится)
        // ============================================================
        const content = {
            en: {
                stealth: 'NLXV / Research — [Stealth Mode] / Internal ecosystem & closed R&D prototypes.',
                back: 'Back',
                catalogTitle: 'Selected Works',
                visit: 'Visit',
                projects: [
                    { title: 'NLXV / Projects', desc: 'digital products, web systems, and software tools.' },
                    { title: 'NLXV / Concepts', desc: 'AI research, generative graphics, and visual experiments.' },
                    { title: 'NLXV / Vision', desc: 'conceptual video, sound design, and media art.' },
                    { title: 'NLXV / Process', desc: 'engineering backstage, technical solutions analysis, and error architecture.' }
                ]
            },
            ru: {
                stealth: 'NLXV / Research — [Stealth Mode] / Внутренняя экосистема и закрытые R&D-прототипы.',
                back: 'Назад',
                catalogTitle: 'Selected Works',
                visit: 'Открыть',
                projects: [
                    { title: 'NLXV / Projects', desc: 'цифровые продукты, веб-системы и программные инструменты.' },
                    { title: 'NLXV / Concepts', desc: 'ИИ-исследования, генеративная графика и визуальные эксперименты.' },
                    { title: 'NLXV / Vision', desc: 'концептуальное видео, саунд-дизайн и медиа-арт.' },
                    { title: 'NLXV / Process', desc: 'инженерный бэкстейдж, разбор технических решений и архитектура ошибок.' }
                ]
            }
        };

        // ============================================================
        //  КАТАЛОГ ПРОЕКТОВ (боевые пет-проекты)
        // ============================================================
        const subProjects = [
            {
                num: '01',
                title: 'Neo Finance',
                tech: 'React + TypeScript · Vite · Tailwind CSS · HTML Canvas API · Web Platform APIs · PWA',
                url: '#'
            },
            {
                num: '02',
                title: 'EcoPrint Norway',
                tech: 'HTML · Tailwind CSS (CDN) · custom CSS · Vanilla JS · Google Fonts',
                url: 'https://github.io'
            }
        ];

        // Фиксированный английский заголовок Hero
        const staticHeroEnglish = 'NLXV — <span class="font-serif-italic">Independent</span> Digital Laboratory.';

        // ============================================================
        //  СОСТОЯНИЕ И ССЫЛКИ НА DOM
        // ============================================================
        let currentLang = 'en';
        let currentTheme = 'dark';

        const bodyElem = document.getElementById('bodyRoot');
        const langToggle = document.getElementById('langToggle');
        const themeToggle = document.getElementById('themeToggle');
        const themeIconMoon = document.getElementById('themeIconMoon');
        const themeIconSun = document.getElementById('themeIconSun');
        const labList = document.getElementById('labList');
        const projectsCatalog = document.getElementById('projectsCatalog');

        // ============================================================
        //  РЕНДЕР ГЛАВНОГО СПИСКА
        // ============================================================
        function renderMainList() {
            document.getElementById('heroTitle').innerHTML = staticHeroEnglish;
            document.getElementById('stealthText').textContent = content[currentLang].stealth;

            labList.innerHTML = '';

            content[currentLang].projects.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'list-item';

                if (index === 0) {
                    row.setAttribute('role', 'button');
                    row.setAttribute('tabindex', '0');
                    row.setAttribute('aria-label', 'Open projects catalog');
                    row.addEventListener('click', openCatalog);
                    row.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            openCatalog();
                        }
                    });
                }

                row.innerHTML = `
                    <div class="item-title">${item.title}</div>
                    <div class="item-desc">${item.desc}</div>
                `;

                row.addEventListener('mouseenter', () => {
                    row.querySelector('.item-desc').style.color = currentTheme === 'dark' ? '#ffffff' : '#1c1c1e';
                });
                row.addEventListener('mouseleave', () => {
                    row.querySelector('.item-desc').style.color = 'var(--text-muted)';
                });

                labList.appendChild(row);
            });
        }

        // ============================================================
        //  РЕНДЕР КАТАЛОГА ПРОЕКТОВ
        // ============================================================
        function renderCatalog() {
            const data = content[currentLang];

            let cardsHtml = '';
            subProjects.forEach(p => {
                const isLink = p.url && p.url !== '#';
                const tag = isLink ? 'a' : 'div';
                const attrs = isLink
                    ? `href="${p.url}" target="_blank" rel="noopener noreferrer"`
                    : '';

                cardsHtml += `
                    <${tag} class="project-card" ${attrs}>
                        <div class="project-num">${p.num}</div>
                        <div class="project-info">
                            <div class="project-name">${p.title}</div>
                            <div class="project-stack">${p.tech}</div>
                        </div>
                        <div class="project-link">
                            <span>${data.visit}</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 17L17 7M17 7H8M17 7V16"/>
                            </svg>
                        </div>
                    </${tag}>
                `;
            });

            projectsCatalog.innerHTML = `
                <div class="catalog-header">
                    <button class="back-btn" id="backBtn" type="button">
                        <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span>${data.back}</span>
                    </button>
                    <div class="catalog-counter">${data.catalogTitle} / ${String(subProjects.length).padStart(2, '0')}</div>
                </div>
                <div class="catalog-list">
                    ${cardsHtml}
                </div>
            `;

            document.getElementById('backBtn').addEventListener('click', closeCatalog);
        }

        // ============================================================
        //  ПЕРЕХОДЫ МЕЖДУ ГЛАВНЫМ СПИСКОМ И КАТАЛОГОМ
        // ============================================================
        function openCatalog() {
            labList.classList.add('is-hidden');

            setTimeout(() => {
                labList.style.display = 'none';

                projectsCatalog.classList.add('is-shown');
                void projectsCatalog.offsetHeight;
                projectsCatalog.classList.add('is-visible');
            }, 400);
        }

        function closeCatalog() {
            projectsCatalog.classList.remove('is-visible');

            setTimeout(() => {
                projectsCatalog.classList.remove('is-shown');

                labList.style.display = 'block';
                void labList.offsetHeight;
                labList.classList.remove('is-hidden');
            }, 450);
        }

        // ============================================================
        //  ПОЛНЫЙ РЕНДЕР ПРИ СМЕНЕ ЯЗЫКА / ТЕМЫ
        // ============================================================
        function renderContent() {
            renderMainList();
            renderCatalog();
        }

        // ============================================================
        //  ОБРАБОТЧИКИ UI
        // ============================================================
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            langToggle.textContent = currentLang.toUpperCase();
            document.documentElement.lang = currentLang;
            renderContent();
        });

        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'dark') {
                bodyElem.className = 'light';
                currentTheme = 'light';
                themeIconMoon.style.display = 'block';
                themeIconSun.style.display = 'none';
            } else {
                bodyElem.className = 'dark';
                currentTheme = 'dark';
                themeIconMoon.style.display = 'none';
                themeIconSun.style.display = 'block';
            }
            renderContent();
        });

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        renderContent();
    </script>
</body>
</html>
